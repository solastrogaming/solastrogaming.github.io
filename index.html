<style>
  :root { --red:#e8242c; --red-deep:#76101a; --ink:#0e0e10; --bg:#120709; --text:#f5f0f0; --muted:#c9b4b6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { min-height:100%; }
  body {
    font-family:Montserrat,system-ui,sans-serif; color:var(--text); background:var(--bg);
    background-image:radial-gradient(ellipse 90% 60% at 50% 18%, #7a0f17 0%, #3a080c 45%, var(--bg) 80%);
    background-attachment:fixed; min-height:100vh; overflow-x:hidden;
  }
  .lines { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; opacity:.55; }
  main { position:relative; max-width:480px; margin:0 auto; padding:56px 16px 40px; text-align:center; }
  .logo { width:132px; height:132px; border-radius:50%; display:block; margin:0 auto 20px;
    box-shadow:0 0 0 3px rgba(232,36,44,.35), 0 12px 40px rgba(0,0,0,.6), 0 0 60px rgba(232,36,44,.25); }
  h1 { font-weight:900; font-size:44px; letter-spacing:.01em; line-height:1;
    text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 5px 0 var(--ink), 0 8px 18px rgba(0,0,0,.6); }
  .sub { font-weight:800; color:var(--red); letter-spacing:.42em; font-size:16px; margin:10px 0 0 .42em;
    text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 0 3px 0 var(--ink); }
  .tag { color:var(--muted); font-weight:600; font-size:15px; margin:18px 0 28px; }
  .links { display:flex; flex-direction:column; gap:12px; }
  .link { display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--text); text-align:left;
    background:rgba(14,14,16,.78); border:1px solid rgba(232,36,44,.28); border-radius:14px; padding:14px 16px;
    transition:transform .15s ease, border-color .15s ease, background .15s ease; backdrop-filter:blur(4px); }
  .link:hover, .link:focus-visible { transform:translateY(-2px); border-color:var(--red); background:rgba(24,10,12,.9); outline:none; }
  .link.primary { background:var(--red); border-color:var(--red); box-shadow:0 8px 24px rgba(232,36,44,.35); }
  .link.primary:hover, .link.primary:focus-visible { background:#f2333b; }
  .link.primary .s { color:#ffe3e4; }
  .ic { flex:0 0 40px; height:40px; display:grid; place-items:center; }
  .ic img { max-width:30px; max-height:26px; }
  .ic svg { width:28px; height:28px; color:#fff; }
  .dot { width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.3);
    animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 8px rgba(255,255,255,0); } }
  .txt { flex:1; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .t { font-weight:800; font-size:16px; }
  .s { font-weight:600; font-size:13px; color:var(--muted); }
  .arr { width:20px; height:20px; opacity:.6; flex:0 0 auto; }
  footer { margin-top:36px; color:rgba(201,180,182,.6); font-size:12px; font-weight:600; letter-spacing:.06em; }
  @media (prefers-reduced-motion: reduce) { .dot { animation:none; } .link { transition:none; } }
</style>
